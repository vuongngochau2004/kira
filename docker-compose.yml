# KIRA Development Environment
# Usage: docker compose up -d

services:
  # ===== PostgreSQL with pgvector =====
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kira-simple-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kira_secret}
      POSTGRES_DB: ${POSTGRES_DB:-kira_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro  # Run migrations on init
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kira} -d ${POSTGRES_DB:-kira_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Qdrant (Vector DB) =====
  qdrant:
    image: qdrant/qdrant:latest
    container_name: kira-simple-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== MinIO (Object Storage) =====
  minio:
    image: pgsty/minio:latest
    container_name: kira-simple-minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"   # API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-kira_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-kira_minio_secret}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Redis (Celery broker/result backend) =====
  redis:
    image: redis:7-alpine
    container_name: kira-simple-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: kira-simple-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-kira_neo4j_password}"
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/7687'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===== Application (profile "app"; started by `make deploy` / `make deploy-tunnel`) =====
  # Infra-only `docker compose up -d` (make infra) is unaffected by these services.
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kira-backend:latest
    container_name: kira-simple-api
    restart: unless-stopped
    profiles: ["app", "tunnel"]
    env_file: .env
    environment: &backend-env
      DEBUG: ${DEPLOY_DEBUG:-false}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      MINIO_ENDPOINT: minio:9000
      NEO4J_URI: bolt://neo4j:7687
      # PDFs: VLM page transcription first; PyMuPDF + PaddleOCR only when VLM fails.
      PDF_EXTRACTOR: ${DEPLOY_PDF_EXTRACTOR:-vlm}
      OCR_BASE_URL: ${DEPLOY_OCR_BASE_URL:-http://host.docker.internal:8889}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach host-only services (OCR, local embedding)
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      minio: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8006/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kira-backend:latest
    container_name: kira-simple-worker
    restart: unless-stopped
    profiles: ["app", "tunnel"]
    command: >
      celery -A kira.worker.celery_app worker
      --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-1}
    env_file: .env
    environment: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api: { condition: service_started }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        KIRA_API_URL: http://api:8006
    image: kira-frontend:latest
    container_name: kira-simple-frontend
    restart: unless-stopped
    profiles: ["app", "tunnel"]
    ports:
      - "${DEPLOY_FRONTEND_PORT:-3002}:3000"  # 3002 so it can run beside `npm run dev` on 3001
    environment:
      KIRA_API_URL: http://api:8006
    depends_on:
      api: { condition: service_healthy }

  # ===== Cloudflare Tunnel (profile "tunnel") =====
  # No token -> Quick Tunnel (random https://*.trycloudflare.com URL).
  # With CLOUDFLARE_TUNNEL_TOKEN + CLOUDFLARE_TUNNEL_CMD="tunnel --no-autoupdate run" -> Named Tunnel.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kira-simple-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: ${CLOUDFLARE_TUNNEL_CMD:-tunnel --no-autoupdate --url http://frontend:3000}
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - frontend

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  redis_data:
  neo4j_data:
