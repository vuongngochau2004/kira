# K.I.R.A Static Configuration
# Model parameters, chunking, retrieval settings that rarely change

# Embedding
embedding:
  dim: 1024                    # Vector dimension for Qdrant
  base_url: "http://localhost:8001"   # Embedding API server

# Retrieval
retrieval:
  k: 5                         # Top-k chunks to retrieve
  rrf_k: 60                    # RRF constant (higher → more diversity)

# Reranking (LLM-based document reranking)
reranking:
  enabled: false               # Enable LLM reranking (default: disabled)
  mode: "llm"                  # "llm" for LLM-based, "score" for individual scoring
  top_k_before: 20             # Number of candidates to rerank
  top_k_after: 5               # Number of top results after reranking
  min_score_threshold: 0.3     # Minimum score for score_and_rerank mode
  timeout_ms: 10000             # Timeout for LLM reranking calls

# Citations
citations:
  max_citations: 10            # Maximum citations to return (was hard-coded 5)
  min_score_threshold: 0.3     # Minimum score for citations
  snippet_length: 200           # Character length for citation snippets

# Citation Verification (New: Hybrid Citation System)
citation_verification:
  enabled: true                 # Enable citation verification and regenerate
  grounding_threshold: 0.7      # Minimum similarity for verified status (0-1)
  max_regenerate_attempts: 2    # Max regenerations to prevent infinite loops
  enable_warnings: true         # Show warning tags for weak grounding

# Chunking
chunking:
  size: 2048                   # Token limit per chunk
  overlap: 256                 # Overlap tokens

# Qdrant
qdrant:
  collection: "document_chunks"
  vector_dim: 1024

# Semantic Routing
semantic_routing:
  enabled: true                 # Feature flag for semantic routing
  threshold: 0.75              # Similarity threshold (0.0-1.0)
