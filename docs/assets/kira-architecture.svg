<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">KIRA architecture diagram</title>
  <desc id="desc">High-level architecture diagram for the KIRA RAG system.</desc>
  <rect width="1280" height="720" rx="24" fill="#FFFFFF"/>
  <text x="80" y="88" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">KIRA Architecture</text>
  <text x="80" y="122" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="16">Hexagonal modular monolith with hybrid retrieval and background ingestion</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect x="80" y="190" width="190" height="92" rx="18" fill="#ECFEFF" stroke="#67E8F9"/>
  <text x="129" y="228" fill="#155E75" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Next.js UI</text>
  <text x="118" y="254" fill="#0E7490" font-family="Inter, Arial, sans-serif" font-size="14">Chat, upload, sources</text>
  <rect x="350" y="190" width="190" height="92" rx="18" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="398" y="228" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">FastAPI</text>
  <text x="386" y="254" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="14">Auth and API routers</text>
  <rect x="620" y="160" width="250" height="152" rx="20" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="672" y="198" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Application Modules</text>
  <text x="650" y="230" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="14">chat, document, retrieval</text>
  <text x="650" y="256" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="14">classification, rag, evaluation</text>
  <rect x="950" y="160" width="250" height="152" rx="20" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="1006" y="198" fill="#9A3412" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Shared Layer</text>
  <text x="986" y="230" fill="#C2410C" font-family="Inter, Arial, sans-serif" font-size="14">ports, adapters, kernel</text>
  <text x="1002" y="256" fill="#C2410C" font-family="Inter, Arial, sans-serif" font-size="14">auth, DB, monitoring</text>
  <line x1="270" y1="236" x2="342" y2="236" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="540" y1="236" x2="612" y2="236" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="870" y1="236" x2="942" y2="236" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="112" y="440" width="170" height="78" rx="16" fill="#EEF2FF" stroke="#A5B4FC"/>
  <text x="157" y="473" fill="#3730A3" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">PostgreSQL</text>
  <text x="156" y="496" fill="#4F46E5" font-family="Inter, Arial, sans-serif" font-size="13">metadata, auth</text>
  <rect x="342" y="440" width="170" height="78" rx="16" fill="#ECFDF5" stroke="#86EFAC"/>
  <text x="394" y="473" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Qdrant</text>
  <text x="381" y="496" fill="#16A34A" font-family="Inter, Arial, sans-serif" font-size="13">vector chunks</text>
  <rect x="572" y="440" width="170" height="78" rx="16" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="617" y="473" fill="#92400E" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">MinIO</text>
  <text x="617" y="496" fill="#B45309" font-family="Inter, Arial, sans-serif" font-size="13">source files</text>
  <rect x="802" y="440" width="170" height="78" rx="16" fill="#FEE2E2" stroke="#FCA5A5"/>
  <text x="850" y="473" fill="#991B1B" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Redis</text>
  <text x="841" y="496" fill="#DC2626" font-family="Inter, Arial, sans-serif" font-size="13">Celery queue</text>
  <rect x="1032" y="440" width="170" height="78" rx="16" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="1080" y="473" fill="#5B21B6" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">AI APIs</text>
  <text x="1060" y="496" fill="#7C3AED" font-family="Inter, Arial, sans-serif" font-size="13">LLM, embeddings</text>
  <line x1="1075" y1="312" x2="1075" y2="432" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="745" y1="312" x2="745" y2="390" stroke="#64748B" stroke-width="3"/>
  <line x1="197" y1="390" x2="1117" y2="390" stroke="#64748B" stroke-width="3"/>
  <line x1="197" y1="390" x2="197" y2="432" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="427" y1="390" x2="427" y2="432" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="657" y1="390" x2="657" y2="432" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="887" y1="390" x2="887" y2="432" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
